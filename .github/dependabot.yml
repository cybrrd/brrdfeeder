version: 2
# Enable Dependency graph, Dependabot alerts and security updates in Settings.
# Security updates are event-driven; these schedules govern version updates.
updates:
  - package-ecosystem: cargo
    # Workspace members share this root Cargo.lock; do not add member locks.
    # Gate: Component/brrdfeeder/install/tests/public-ci/check-single-lockfile.py
    # Stale nested locks create invalid member-scoped security-update jobs.
    directory: /Component/aviary
    schedule: {interval: weekly}
    # GPS parsing stays on 0.7 until its separately reviewed migration.
    # Explicit range also blocks the breaking 0.x minor (0.7 -> 0.8).
    ignore:
      - dependency-name: nmea
        versions: ['>=0.8']
      - dependency-name: nmea
        update-types: ['version-update:semver-major']
    groups:
      cargo-version: {patterns: ['*'], applies-to: version-updates}
      cargo-security: {patterns: ['*'], applies-to: security-updates}
  - package-ecosystem: gomod
    directories: [/Component/brrdhouse, /Component/aviary/release-system]
    schedule: {interval: weekly}
    groups:
      go-version: {patterns: ['*'], applies-to: version-updates}
      go-security: {patterns: ['*'], applies-to: security-updates}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions-version: {patterns: ['*'], applies-to: version-updates}
      actions-security: {patterns: ['*'], applies-to: security-updates}
  - package-ecosystem: docker
    directories: [/Component/aviary/engine, /Component/aviary/release-system, /Component/brrdhouse, /Component/brrdfeeder/install/tests]
    schedule: {interval: weekly}
    groups:
      containers-version: {patterns: ['*'], applies-to: version-updates}
      containers-security: {patterns: ['*'], applies-to: security-updates}
