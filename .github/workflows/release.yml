# Builds are unprivileged. The development team must configure the release environment first.
name: Public release
on:
  push:
    tags: ['v*']
  workflow_dispatch: # Dispatch --ref v1.2.3; branch refs never publish.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  images:
    needs: [gate]
    if: github.repository == 'cybrrd/brrdfeeder' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        component: [engine, console]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13.5'}
      - name: Pinned build and SBOM tools
        run: bash .github/scripts/setup-release.sh build
      - name: Build and verify local image and SBOM (no registry writes or signing)
        run: bash .github/scripts/release-image.sh
        env:
          COMPONENT: ${{ matrix.component }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.component }}-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
  host-updater:
    needs: [gate]
    if: github.repository == 'cybrrd/brrdfeeder' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version: '1.27.0', cache: false}
      - name: Reproduce installer-pinned host updater (no signing)
        run: bash Component/aviary/release-system/build-host.sh "$RUNNER_TEMP/host-updater"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-updater
          path: ${{ runner.temp }}/host-updater/
          if-no-files-found: error
          retention-days: 7
  publish-sign:
    needs: [gate, images, host-updater]
    if: github.repository == 'cybrrd/brrdfeeder' && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_APPROVAL_CONFIGURED == 'true'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # draft release only; the release approver publishes the draft
      packages: write
      id-token: write # no other job may obtain an OIDC token
      attestations: write
    steps:
      - name: Share ephemeral registry auth with provenance actions
        run: printf 'DOCKER_CONFIG=%s/registry-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-release'
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: host-updater
          path: ${{ runner.temp }}/host-updater
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13.5'}
      - name: Pinned publication tools (no build)
        run: bash .github/scripts/setup-release.sh publish
      - name: Verify both archives, publish exact digests and keyless-sign
        id: publish
        run: bash .github/scripts/publish-images.sh
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_APPROVAL_CONFIGURED: ${{ vars.RELEASE_APPROVAL_CONFIGURED }}
      - name: Attest engine provenance
        id: engine-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cybrrd/brrdfeeder
          subject-digest: ${{ steps.publish.outputs.engine-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest console provenance
        id: console-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cybrrd/brrdhouse
          subject-digest: ${{ steps.publish.outputs.console-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Create draft release with changelog, digests, SBOMs and attestation URLs
        run: python3 .github/scripts/draft-release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINE_ATTESTATION_URL: ${{ steps.engine-provenance.outputs.attestation-url }}
          CONSOLE_ATTESTATION_URL: ${{ steps.console-provenance.outputs.attestation-url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-release-receipts
          path: ${{ runner.temp }}/release-notes/
          if-no-files-found: error
      - name: Remove ephemeral registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth/config.json"
