name: Public offline contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0; Node 20 compatible
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; Node 20 compatible
        with:
          python-version: '3.13.5'
      - name: Provision pinned offline-test dependencies
        run: bash .github/scripts/setup-tests.sh
      - name: All offline contracts
        run: python3 Component/brrdfeeder/install/tests/run.py --group all --out "$RUNNER_TEMP/contracts"
        env:
          TEST_OS_IMAGE: localhost/brrd-contract-os:20260929
      - name: Retain synthetic test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-contracts
          path: ${{ runner.temp }}/contracts/
          if-no-files-found: error
