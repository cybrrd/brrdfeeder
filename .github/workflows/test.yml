name: Public offline contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Single workspace Cargo lockfile
        run: python3 Component/brrdfeeder/install/tests/public-ci/check-single-lockfile.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - name: Provision pinned offline-test dependencies
        run: bash .github/scripts/setup-tests.sh
      - name: Public helper documentation contracts
        run: |
          python3 Component/aviary/release-system/tests/test_docs.py
          python3 Component/aviary/release-system/tests/mutate_docs.py
      - name: All offline contracts
        run: python3 Component/brrdfeeder/install/tests/run.py --group all --out "$RUNNER_TEMP/contracts"
        env:
          TEST_OS_IMAGE: localhost/brrd-contract-os:20260929
      - name: Retain synthetic test receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-contracts
          path: ${{ runner.temp }}/contracts/
          if-no-files-found: error
