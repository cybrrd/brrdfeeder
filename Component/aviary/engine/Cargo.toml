[package]
name = "engine"
version = "0.8.23"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
pcap = "2.5" # Used for capturing packets
async-nats = "0.50" # First release compatible with patched rustls-webpki 0.103.13.
bytes = "1" # #178: opaque pre-serialized payloads in the multiplexed NATS supervisor
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11" # D32: hash exactly the loaded config bytes; already in Cargo.lock.
ed25519-dalek = "3"   # #185 Phase 3 — E-CNP-001 Blue policy signature verification
hex = "0.4"           # #185 Phase 3 — decode the 64-byte Ed25519 sig
futures = "0.3"       # #185 Phase 3 Drop 1c — StreamExt for the JetStream control consumer
tokio = { version = "1.34", features = ["full", "rt-multi-thread"] }
radiotap = "1.2"
cybrrd-rid-protocol = { path = "../cybrrd-rid-protocol" }
caps = "0.5"  # Wave 7.1: startup capability check (cap_net_admin, cap_net_raw)
nl80211-ng = "0.5"  # Wave 7.1: native nl80211 channel control (no shell-out)
neli = "0.7"  # Wave 7.1 Inc 4: direct netlink for CMD_GET_SURVEY (not exposed by nl80211-ng)

# Wave 7.2 (2026-05-26) — Sensor trait + UbloxGps. First non-Wi-Fi
# producer in the Anastomotic Reticulum. BLE + SDR will land next as
# additional `Sensor` impls.
nmea = "0.8"           # NMEA 0183 parser for u-blox GPS over CDC-ACM
chrono = "0.4"         # #183: assemble GPS UTC (RMC date + time) → epoch ms
libc = "0.2"           # #183: clock_settime(CLOCK_REALTIME) for GPS clock-discipline
tokio-serial = "5.4"   # Async serial port (CDC-ACM /dev/ttyACM1)
arc-swap = "1.7"       # Lock-free atomic-swap shared health/fix snapshots
tokio-util = "0.7"     # CancellationToken for sensor lifecycle
