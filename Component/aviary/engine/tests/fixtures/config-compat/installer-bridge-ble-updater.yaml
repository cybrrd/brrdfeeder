node:
  id: brrdfeeder-fixture-001
  channel: dev
  status_file: /var/lib/brrdfeeder-status/status.json
  storage_class: ephemeral
  location:
    latitude: 40.88259
    longitude: -95.69092
    elevation_meters: 320.0
capture:
  interface: wlx001122334455
  hunter:
    enabled: true
backhaul:
  broker_urls:
  - tls://ingest.cybrrd.com:4222
  credentials_path: /var/lib/brrdfeeder/credentials/brrdfeeder.creds
  target_subject: cybrrd.telemetry.frame.rid
tuning:
  edge_processing:
    deduplication_window_ms: 1000
  heartbeat:
    interval_secs: 5
sensors:
  gps:
    device: /dev/cybrrd_gps
    required: true
    usb_id: 10c4:ea60
  rid_ble:
    enabled: true
    unblock_rfkill: true
    adapter:
      usb_id: 0bda:876e
upward:
  spool_dir: /var/lib/brrdfeeder/upward
