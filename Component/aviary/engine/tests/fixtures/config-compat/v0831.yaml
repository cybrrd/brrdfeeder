node:
  id: unenrolled
  channel: general
  status_file: /var/lib/brrdfeeder-status/status.json
  storage_class: ephemeral
  location:
    latitude: 40.88259
    longitude: -95.69092
    elevation_meters: 320.0
capture:
  interface: EDIT-ME-wlanX
  hunter:
    enabled: true
backhaul:
  broker_urls:
  - tls://ingest.cybrrd.com:4222
  credentials_path: /etc/brrdfeeder/secrets/brrdfeeder.creds
  target_subject: cybrrd.telemetry.frame.rid
tuning:
  edge_processing:
    deduplication_window_ms: 1000
  heartbeat:
    interval_secs: 5
sensors:
  gps:
    device: /dev/cybrrd_gps
    required: true
