id: REQ-BRRD-002
title: GPS trust gate — no publishing without fix and disciplined time
statement: >-
  WHILE sensors.gps.required is true, WHEN the engine has not acquired a 3D GPS
  fix AND GPS-disciplined system time within sensors.gps.startup_grace_secs of
  start, the engine SHALL exit non-zero; and WHILE the gate has not passed, the
  engine SHALL NOT publish telemetry or heartbeats.
rationale: >-
  Witness-grade evidence requires trusted position + time. Anchors: #183 (no-RTC
  clock-skew frame rejection at the Bohr Spool) and the Reputation-Portability
  Attack (Wave 7.4, 2026-05-26) — an un-anchored node could earn trust at site X
  and testify from site Y. The explicit opt-out (required=false) self-discloses
  on the wire (node_position_source=config_static) so downstream consumers can
  refuse to accumulate trust against it.
binds:
  - "engine/src/main.rs (GPS startup gate, #183)"
  - "engine/src/sensor_gps.rs"
  - "engine/src/node_config.rs::GpsYaml"
verify:
  - >-
    FIELD-WITNESSED 2026-07-13 (unplanned live drill — robin relocation):
    0 satellites -> engine exited 1 at exactly startup_grace_secs (120s),
    systemd restart-looped (NRestarts 1..3), zero publishes reached command;
    window placement -> 6-sat fix (HDOP 1.92) -> gate passed first try
    (NRestarts=0) -> first heartbeat 2026-07-14T00:45:28Z observed by command.
    Witnesses: Cy (hands-on) + Synth (instrumented).
  - "PENDING: automated regression — gate-timeout exit path + no-publish-before-gate (promote to cargo test)"
status: open
provenance:
  decided: "2026-05-26 (Wave 7.4 trust tier); ratified into the ledger 2026-07-13"
  witness: "Cy + Synth"
notes: >-
  Companion finding from the same drill: a GPS-gated node is indistinguishable
  from a dark node to command — liveness (Silver) and evidence (Green) are
  currently gated together. Candidate follow-on requirement: a pre-gate
  liveness heartbeat explicitly marked os_clock_trusted=false (the schema
  already carries the field). Routed to Cy — it touches the trust doctrine.
