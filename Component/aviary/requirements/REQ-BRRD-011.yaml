  - "ADR-0008 (Green 1 Hz Metronome) — the liveness heartbeat cadence"
  - "ADR-0009 (Red Algedonic Channel) — source-down escalation"
  - "ADR-0010 (Edge Node Service Management)"
  - "ECOLOGEE E-VSM Color Network Protocol — Green/Silver/Red semantics"
  - "REQ-BRRD-004 (edge is a witness / T2 anti-sovereign), REQ-BRRD-009/010 (observation purity)"
