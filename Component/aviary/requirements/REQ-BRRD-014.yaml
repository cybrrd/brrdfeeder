id: REQ-BRRD-014
title: Bluetooth receive sensor is passive, PHY-capability-detected, identity-bound and health-signaled
statement: >-
  WHEN sensors.rid_ble is enabled for bluetooth4_legacy or bluetooth5_long_range,
  the engine SHALL bind a unique adapter identity, detect its receive PHY
  capabilities, scan passively without connecting, advertising or pairing,
  emit raw AD through the shared host decoder and post-parse pipeline, and
  signal Initializing, Healthy, Degraded and Failed from observed substrate state.
  WHEN disabled (the default), it SHALL perform no Bluetooth operations.
rationale: >-
  Unit tests verify policy and parsing but cannot witness radio passivity,
  controller ownership, loss or Coded RX. BlueZ loopback cannot close the raw
  USER-socket runtime contract. Require dedicated-controller privileged RF
  capture proving 1M/Coded selection, passive-only air behavior, quiet-window
  degradation and recovery, unplug failure and bounded scan shutdown before binding.
binds:
  - "engine/src/rid_ble.rs"
  - "engine/src/node_config.rs"
  - "engine/src/main.rs"
  - "engine/src/capture.rs"
  - "tools/bt-dongle-gate.sh (bench-only pre-fleet USB/firmware/USER-channel capability gate)"
verify:
  - "engine::rid_ble::tests::verify_req_brrd_014_passive_scan_parameters"
  - "engine::rid_ble::tests::verify_req_brrd_014_identity_never_index_only"
  - "engine::rid_ble::tests::verify_req_brrd_014_ad_reports_preserve_phy_and_refuse_fragments"
  - "engine::rid_ble::tests::verify_req_brrd_014_health_and_disabled_no_hardware"
  - "engine::node_config::tests::verify_req_brrd_014_config_refuses_unknown_and_defaults_disabled"
  - "engine::capture::tests::verify_req_brrd_014_shared_pipeline_gps_dedup_store_backpressure"
  - "tools/test-bt-dongle-gate.sh (offline fixtures: 876e/8771 accept, a728 reject with kernel commits, unknown stop, dry-run no-touch)"
status: open
note: >-
  Field-evidenced on test-node-3 2026-09-17: exclusive USER startup, runtime 1M+Coded
  selection, Healthy state and 364 decoded session frames (15 Amazon MK30 serials,
  both BLE PHYs, plus DJI Wi-Fi). Remains open only for controlled passive-air,
  quiet/loss/recovery and bounded-shutdown evidence; do not claim those from a bus log.
  D8 adds only an offline-tested arrival gate and does not convert fixture output into
  hardware evidence or close any of those remaining runtime assays.
provenance:
  decided: "2026-09-15 — implementation proposed under the development team dispatch, the release approver T1 review pending"
  witness: "the release approver field run + the development team node logs recorded 2026-09-17; D1 performs no node contact"
  evidence: "governance/reviews/2026-09-17-amazon-mk30-rid/ (repo root), FINDING.md, papillion-session-count.txt and papillion-session-frames-2026-09-17.jsonl"
references:
  - "REQ-BRRD-003, REQ-BRRD-004, REQ-BRRD-005, REQ-BRRD-006, REQ-BRRD-011"
  - "docs/decisions/0005-rid-ble-ingest-path.md"
