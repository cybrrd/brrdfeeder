id: REQ-BRRD-016
title: Cadence-aware, deadline-fair Wi-Fi channel schedule without aircraft following
statement: >-
  WHEN the hunter is enabled, the engine SHALL schedule Wi-Fi channel visits so the
  social channels (6 and 149) each receive a long dwell — at least one NAN
  discovery-window period (512 TU) plus margin and at least 1000 ms so a >=1 Hz
  Beacon is caught with high probability — while every other configured channel
  still receives a short, fair visit every supercycle, with dwell length and
  visit order jittered deterministically so no transmitter cadence can phase-lock
  against the schedule. The default configuration SHALL NOT include
  aircraft-following lock-on; lock-on SHALL remain available only as an explicit
  opt-in single-target audit mode. The engine SHALL expose the schedule as
  presets (social, park6, sweep) with explicit operator values always winning
  over preset defaults, SHALL stamp the receive channel and its provenance
  (radiotap-measured or hunter-configured) on every Wi-Fi observation, SHALL
  report per-channel dwell share, accumulated dwell, RID frames heard, and
  measured set_channel round-trip statistics in the heartbeat hunter block, and
  SHALL fail closed before radio administration when the designated capture
  adapter carries the host default route.
rationale: >-
  A network receiver must hear the SET of aircraft in range. The legacy
  200/400 ms rotation gave the social channels ~10% of wall time and turned
  >=1 Hz broadcast cadence into ~4-5 s observation gaps (a receiver artifact
  misread as a transmitter cadence floor), while aircraft-triggered lock-on
  could monopolize a channel indefinitely. Pre-registered simulator evidence
  and field heartbeat accounting must be able to prove both fixes.
binds:
